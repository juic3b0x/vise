[package]
name = "vise-bench-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Intentionally independent of Vise's build, tests, dependencies and MSRV job.
[workspace]

[dependencies]
httparse = "1"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
socket2 = { version = "0.6", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time"] }

[profile.release]
overflow-checks = true

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["test-util"] }
