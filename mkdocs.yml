site_name: Vise — A firm grip on every download
site_description: Concurrent Rust downloads, durable SQLite recovery, and precise control from the CLI, daemon, and WebUI.
site_url: https://juic3b0x.github.io/vise/
repo_url: https://github.com/juic3b0x/vise
repo_name: juic3b0x/vise
edit_uri: edit/main/docs/
strict: true
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: logo.png
  favicon: logo.png
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: lime
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Remote CLI: remote.md
  - Daemon & API: daemon.md
  - WebUI: webui.md
  - Browser extension: extension.md
  - Architecture: architecture.md
  - Benchmarking: benchmarking.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

validation:
  nav:
    omitted_files: warn
    absolute_links: warn
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/juic3b0x/vise
      name: Vise on GitHub

copyright: Vise contributors · MIT OR Apache-2.0
