[package]
name = "vise"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A resumable concurrent download manager with a CLI and optional local WebUI"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
md5 = { package = "md-5", version = "0.10" }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs2 = "0.4"
futures-util = "0.3"
indicatif = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "socks"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "io-std", "net", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = true

